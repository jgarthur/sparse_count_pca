site_name: sparse-count-pca
site_description: PCA and correspondence analysis of sparse count data
repo_url: https://github.com/jgarthur/sparse_count_pca
repo_name: jgarthur/sparse_count_pca

hooks:
  - docs/hooks/render_examples.py
  - docs/hooks/validate_math.py

watch:
  - examples

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            heading_level: 2
            line_length: 88
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            signature_crossrefs: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format:
            !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format
            kwds:
              mode: generic
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

exclude_docs: |
  examples/**
  history/**
  hooks/**
  wishlist.md

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Transforms: transforms.md
  - Guides:
      - Residual PCA: guides/residual-pca.md
      - Shifted CLR: guides/shifted-clr.md
      - Transform once, reuse: guides/transform-reuse.md
      - Correspondence analysis: guides/correspondence-analysis.md
      - AnnData workflows: guides/anndata-workflows.md
  - Concepts:
      - Sparse plus low rank: concepts/sparse-plus-low-rank.md
      - Normalization, masking, and centering: concepts/normalization-masking-and-centering.md
      - Clipping and precision: concepts/clipping-and-precision.md
  - Reference:
      - Compatibility: reference/compatibility.md
      - Scaled-NB null model: reference/scaled-nb-model.md
      - API:
          - AnnData functions: reference/api/anndata.md
          - Matrix functions: reference/api/matrix.md
          - Transforms: reference/api/transforms.md
          - Result objects: reference/api/results.md
  - Development:
      - Architecture: development/architecture.md
      - Specification: development/specification.md
      - Testing: development/testing.md
