[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparse-count-pca"
version = "1.0.0rc1"
description = "PCA of implicitly represented sparse count transforms"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joey Arthur" }]
keywords = [
    "anndata",
    "bioinformatics",
    "dimensionality reduction",
    "principal component analysis",
    "single-cell",
    "sparse matrix",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "anndata>=0.11.4",
    "numpy>=2.2.6",
    "scikit-learn>=1.7.2",
    "scipy>=1.15.3",
]

[project.urls]
Homepage = "https://sparse-count-pca.readthedocs.io/"
Documentation = "https://sparse-count-pca.readthedocs.io/en/latest/"
Repository = "https://github.com/jgarthur/sparse_count_pca"
Issues = "https://github.com/jgarthur/sparse_count_pca/issues"
Changelog = "https://github.com/jgarthur/sparse_count_pca/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "ipykernel",
    "jupytext",
    "mkdocs-material",
    "mkdocstrings-python",
    "nbconvert",
    "ruff",
]
test = ["pytest", "ruff", "scanpy>=1.10", "zarr"]

[tool.hatch.build.targets.wheel]
packages = ["src/sparse_count_pca"]

[tool.hatch.build.targets.sdist]
only-include = [
    "/src",
    "/tests",
    "/CHANGELOG.md",
    "/examples",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/README.md",
    "/docs",
    "/mkdocs.yml",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
